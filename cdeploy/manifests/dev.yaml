piVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: entropy-ssr-development
  labels:
    run.googleapis.com/satisfiesPzs: "true"
    cloud.googleapis.com/location: us-east4
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      labels:
        run.googleapis.com/startupProbeType: Default
      annotations:
        run.googleapis.com/vpc-access-egress: all-traffic
        run.googleapis.com/network-interfaces: "[{\"network\":\"entropy-vpc-development\"\
          ,\"subnetwork\":\"entropy-subnet-development-01\"}]"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: fleet-service@minecraft-server-501415.iam.gserviceaccount.com
      containers:
      - name: entropy-dashboard-1
        image: container-image-dev
        ports:
        - name: http1
          containerPort: 3000
        env:
        - name: ENTROPY_API_URL
          value: https://mcp-server-development-534053084464.us-east4.run.app
        - name: ENTROPY_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: mcp-apikey-development
        resources:
          limits:
            cpu: 1000m
            memory: 256Mi
        startupProbe:
          timeoutSeconds: 240
          periodSeconds: 240
          failureThreshold: 1
          tcpSocket:
            port: 3000
  traffic:
  - percent: 100
    latestRevision: true